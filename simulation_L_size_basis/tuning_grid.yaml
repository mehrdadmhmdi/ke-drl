# Stability-focused tuning grid for the L-by-m mean-embedding basis simulation.
# Baseline in params_tune.yaml:
#   mean_embedding_basis in current (S,A), n_basis=5000,
#   nu=7.5, sigma=0.7, length_scale=1.0, lambda_B=0.05,
#   mass_anchor_lambda=10, lr=1e-4, eta_clip_max=3.0.
# Exported plots/tables use the 10 evaluation target points with the lowest
# median projected_bellman_test_risk among those below 0.15. Unscreened tables
# are saved as *_all.
combos:
  - name: sim3_joint_nu7p5_sigma0p7_mass10
    overrides: {}

  - name: mass_anchor_20
    overrides:
      optimization:
        mass_anchor_lambda: 20.0

  - name: lambdaB_0p10
    overrides:
      lambda_B: 0.10

  - name: lambdaB_0p20
    overrides:
      lambda_B: 0.20

  - name: mean_embedding_basis_7000
    overrides:
      mean_embedding_basis:
        n_basis: 7000

  - name: kernel_length_0p75
    overrides:
      kernel:
        length_scale: 0.75

  - name: eta_clip_2
    overrides:
      optimization:
        eta_clip_max: 2.0
