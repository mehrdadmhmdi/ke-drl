# Stability-focused tuning grid.
# Baseline in params_tune.yaml:
#   sigma=0.7, nu=5.5, length_scale=1.0, lambda_reg=0.005,
#   lambda_B=0.05, mass_anchor_lambda=3.0, lr=1e-4, eta_clip_max=3.0.
# Exported plots/tables use only benchmark-replicate curves with
# projected_bellman_test_risk < 0.15; unscreened tables are saved as *_all.
combos:
  - name: stable_sigma0p7_mass3
    overrides: {}

  - name: stronger_mass5
    overrides:
      optimization:
        mass_anchor_lambda: 5.0

  - name: stronger_lambdaB_0.10
    overrides:
      lambda_B: 0.10

  - name: weaker_lambdaB_0.02
    overrides:
      lambda_B: 0.02

  - name: tighter_eta_clip2
    overrides:
      optimization:
        eta_clip_max: 2.0

  - name: kernel_length_0.75
    overrides:
      kernel:
        length_scale: 0.75

  - name: kernel_length_1.5
    overrides:
      kernel:
        length_scale: 1.5
