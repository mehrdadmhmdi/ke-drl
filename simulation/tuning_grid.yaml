# Small global-B tuning grid. Run with Job_tune_global.sbatch.
# Keep this short until the pipeline is stable.
combos:
  - name: base
    overrides: {}

  - name: weak_regularization
    overrides:
      lambda_reg: 0.0005
      lambda_B: 0.0005

  - name: stronger_B_ridge
    overrides:
      lambda_B: 0.003

  - name: stronger_gamma_reg
    overrides:
      lambda_reg: 0.003

  - name: shorter_kernel
    overrides:
      kernel:
        length_scale: 0.7
        sigma: 0.7

  - name: wider_kernel
    overrides:
      kernel:
        length_scale: 1.5
        sigma: 0.7

  - name: wider_return_hull
    overrides:
      hull_expand_factor: 1.5

  - name: weaker_mass_anchor
    overrides:
      optimization:
        mass_anchor_lambda: 0.3

  - name: stronger_mass_anchor
    overrides:
      optimization:
        mass_anchor_lambda: 3.0

  - name: very_strong_mass_anchor
    overrides:
      optimization:
        mass_anchor_lambda: 10.0

  - name: more_grid_and_steps
    overrides:
      num_grid_points: 160
      optimization:
        num_steps: 180
      H_batch_size: 16

  - name: larger_sample
    overrides:
      n_ids: 1000
      Z_sim:
        n_ids: 2000
        n_timepoints: 200
      optimization:
        num_steps: 120
