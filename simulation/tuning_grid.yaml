# Small global-B tuning grid. Run with Job_tune_global.sbatch.
# Keep this short until the pipeline is stable.
combos:
  - name: base
    overrides: {}

  - name: weak_regularization
    overrides:
      lambda_reg: 0.0001
      lambda_B: 0.0001

  - name: stronger_B_ridge
    overrides:
      lambda_B: 0.01

  - name: stronger_gamma_reg
    overrides:
      lambda_reg: 0.01

  - name: shorter_kernel
    overrides:
      kernel:
        length_scale: 0.6
        sigma: 0.5

  - name: wider_kernel
    overrides:
      kernel:
        length_scale: 2.0
        sigma: 1.1

  - name: wider_return_hull
    overrides:
      hull_expand_factor: 2.5

  - name: more_grid_and_steps
    overrides:
      num_grid_points: 600
      optimization:
        num_steps: 300
      H_batch_size: 16

  - name: larger_sample
    overrides:
      n_ids: 1000
      Z_sim:
        n_ids: 10000
        n_timepoints: 300
      optimization:
        num_steps: 200
