# Final tuning grid. Run with Job_tune_prepare.sbatch once, then Job_tune_global.sbatch.
# The baseline is defined in params_tune.yaml:
# lambda_B=0.02, kernel.nu=5.5, kernel.length_scale=1.0, kernel.sigma=1.0.
combos:
  - name: base
    overrides: {}

  - name: lambda_B_0.002
    overrides:
      lambda_B: 0.002

  - name: lambda_B_0.00002
    overrides:
      lambda_B: 0.00002

  - name: kernel_nu_7.5
    overrides:
      kernel:
        nu: 7.5

  - name: kernel_length_1.5
    overrides:
      kernel:
        length_scale: 1.5

  - name: kernel_sigma_0.7
    overrides:
      kernel:
        sigma: 0.7

  - name: lambda_B_0.2
    overrides:
      lambda_B: 0.2
