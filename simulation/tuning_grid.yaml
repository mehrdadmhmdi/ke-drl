# Global-B tuning grid. Run with Job_tune_global.sbatch.
# This is a one-factor-at-a-time grid around params_tune.yaml.
# Sample size, benchmark Monte Carlo size, grid size, optimizer steps, and
# H-batch size are fixed in params_tune.yaml so configs differ only by the
# statistical/optimization tuning parameter named in each override.
combos:
  - name: base
    overrides: {}

  - name: lambda_reg_0p0005
    overrides:
      lambda_reg: 0.0005

  - name: lambda_reg_0p003
    overrides:
      lambda_reg: 0.003

  - name: lambda_reg_0p02
    overrides:
      lambda_reg: 0.02

  - name: lambda_B_0p0005
    overrides:
      lambda_B: 0.0005

  - name: lambda_B_0p003
    overrides:
      lambda_B: 0.003

  - name: lambda_B_0p02
    overrides:
      lambda_B: 0.02

  - name: kernel_length_0p7
    overrides:
      kernel:
        length_scale: 0.7

  - name: kernel_length_1p5
    overrides:
      kernel:
        length_scale: 1.5

  - name: kernel_sigma_1
    overrides:
      kernel:
        sigma: 1.0

  - name: kernel_nu_2p5
    overrides:
      kernel:
        nu: 2.5

  - name: kernel_nu_4p5
    overrides:
      kernel:
        nu: 4.5

  - name: hull_expand_1p3
    overrides:
      hull_expand_factor: 1.3

  - name: mass_anchor_0p3
    overrides:
      optimization:
        mass_anchor_lambda: 0.3

  - name: mass_anchor_3
    overrides:
      optimization:
        mass_anchor_lambda: 3.0

  - name: negativity_0p1
    overrides:
      optimization:
        negativity_penalty_lambda: 0.1
