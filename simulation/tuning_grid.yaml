# Final simulation tuning grid. Run with Job_tune_global.sbatch.
# Each config reuses the shared offline data and benchmark truth from
# Job_tune_prepare.sbatch.
combos:
  - name: base
    overrides: {}

  - name: kernel_length_1p0
    overrides:
      kernel:
        length_scale: 1.0

  - name: kernel_length_0p5
    overrides:
      kernel:
        length_scale: 0.5

  - name: kernel_sigma_0p5
    overrides:
      kernel:
        sigma: 0.5

  - name: kernel_sigma_1p0
    overrides:
      kernel:
        sigma: 1.0

  - name: lambda_B_0p02
    overrides:
      lambda_B: 0.02

  - name: mass_anchor_1p0
    overrides:
      optimization:
        mass_anchor_lambda: 1.0
