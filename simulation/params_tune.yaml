    kernel:
      length_scale: 1.65
      sigma: 0.95
    operator_approximation:
      num_features: 1024
    ratio:
      n_basis: 1024
      lambda_reg: 0.0025
    mean_embedding_basis:
      n_basis: 320
      candidate_pool: 90000
      max_iter: 35
    transition_reduction:
      n_basis: 320
      candidate_pool: 90000
      max_iter: 35
    optimization:
      lr: 2e-4
      weight_decay: 5e-5
      num_steps: 7000
      target_batch_size: 256
      mass_anchor_lambda: 3.5
  LU:
    lambda_reg: 0.004
    lambda_B: 0.014
    kernel:
      length_scale: 1.35
      sigma: 0.85
    operator_approximation:
      num_features: 768
    ratio:
      n_basis: 768
      lambda_reg: 0.004
    mean_embedding_basis:
      n_basis: 260
      candidate_pool: 75000
      max_iter: 30
    transition_reduction:
      n_basis: 260
      candidate_pool: 75000
      max_iter: 30
    optimization:
      lr: 2.5e-4
      weight_decay: 5e-5
      num_steps: 6000
      target_batch_size: 200
      mass_anchor_lambda: 2.0
  LG:
    lambda_reg: 0.004
    lambda_B: 0.016
    kernel:
      length_scale: 1.50
      sigma: 0.90
    operator_approximation:
      num_features: 768
    ratio:
      n_basis: 768
      lambda_reg: 0.004
    mean_embedding_basis:
      n_basis: 280
      candidate_pool: 80000
      max_iter: 30
    transition_reduction:
      n_basis: 280
      candidate_pool: 80000
      max_iter: 30
    optimization:
      lr: 2.5e-4
      weight_decay: 5e-5
      num_steps: 6500
      target_batch_size: 200
      mass_anchor_lambda: 2.5
#==========================
embedding_r2:
  enabled: true
  max_truth_points: 512
  batch_size: 512
#==========================
policy:
  evaluation_Target_policy: logistic
  Behvaioral_policy: uniform

  uniform:
    name: uniform
    theta_lower: [0, -0.2, -0.2, -0.8, -0.6]
    theta_upper: [0.2, 0.0, 0.5, -0.1, 0.6]
    epsilon_lower: [0.0]
    epsilon_upper: [0.05]

  gaussian:
    name: gaussian
    theta_mean: [0.8, 0.4, 0.2, 0.3, 0.0]
    theta_std: [0.4, 0.3, 0.3, 0.5, 0.1]
    epsilon_mean: [0.0]
