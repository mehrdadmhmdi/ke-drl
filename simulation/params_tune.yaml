    lambda_reg: 0.003
    lambda_B: 0.012
    kernel:
      length_scale: 1.25
      sigma: 0.85
    operator_approximation:
      num_features: 768
    ratio:
      n_basis: 768
      lambda_reg: 0.003
    mean_embedding_basis:
      n_basis: 250
      candidate_pool: 75000
      max_iter: 30
    transition_reduction:
      n_basis: 250
      candidate_pool: 75000
      max_iter: 30
    optimization:
      lr: 3e-4
      weight_decay: 5e-5
      num_steps: 5500
      target_batch_size: 150
      mass_anchor_lambda: 1.5
  UL:
